<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f7" id="meta-theme-color">
  <title>论文入表助手</title>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/katex/katex.min.js"></script>
  <script defer src="/vendor/markdown-it/markdown-it.min.js"></script>
  <script defer src="/rich-text.js"></script>
  <script defer src="/history.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <aside class="toast-region" id="toast-region" aria-live="polite" aria-label="通知"></aside>

  <header class="top-nav-wrap">
    <div class="top-capsule">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a2.5 2.5 0 0 1 0-5H20"/>
          </svg>
        </span>
        <span class="brand-name">研读工作台</span>
      </div>

      <div class="nav-right">
        <span class="mode" id="mode" role="status">
          <i aria-hidden="true"></i>
          <span>连接中</span>
        </span>

        <button type="button" class="icon-pill theme-btn" id="theme-toggle" aria-label="切换深浅色" title="切换深浅色">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2m-7.07-14.93 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="intro" aria-labelledby="title">
      <div class="intro-copy">
        <h1 id="title">论文入表助手</h1>
        <p>贴入论文链接，用一句话更新阅读清单。</p>
      </div>

      <aside class="floating-card sample-card" hidden id="sample">
        <div class="sample-top">
          <span class="sample-badge">示例论文</span>
          <div class="sample-actions">
            <button type="button" class="mini-copy-btn" id="copy-sample-url" aria-label="复制示例论文链接">
              <svg class="copy-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
              </svg>
              <span class="copy-txt">复制链接</span>
            </button>
            <a id="sample-pdf" class="sample-pdf-pill" hidden target="_blank" rel="noopener noreferrer"><span>PDF</span><svg class="ico-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
          </div>
        </div>
        <div id="sample-title" class="sample-title"></div>
      </aside>
    </section>

    <div class="desk">
      <!-- 左侧悬浮卡片：对话 -->
      <section class="floating-card panel command-panel" aria-labelledby="command-heading">
        <div class="panel-head">
          <div class="panel-title-group">
            <span class="panel-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </span>
            <div>
              <h2 id="command-heading">对话</h2>
              <p class="engine-status" id="engine-mode" role="status" hidden></p>
            </div>
          </div>
          <div class="chat-head-actions">
            <span class="pending-pill" id="pending-badge" hidden>待确认</span>
            <button type="button" class="icon-pill" id="history-open" aria-haspopup="dialog" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5m4-1v5l3 2"/></svg>
              历史与记忆
            </button>
          </div>
        </div>

        <div class="examples">
          <div class="examples-header">
            <span class="small-label">点击试用</span>
          </div>
          <div class="example-grid" id="example-grid">
            <span class="example-glide" id="example-glide" aria-hidden="true"></span>
            <button type="button" data-example="evidence" title="提取示例论文的数据与图表，确认后写入">
              <span>批量提取数据图表</span>
              <span class="ico-wrap" aria-hidden="true"><svg class="ico-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </button>
            <button type="button" data-example="save">
              <span>存入示例论文</span>
              <span class="ico-wrap" aria-hidden="true"><svg class="ico-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </button>
            <button type="button" data-example="method">
              <span>补充方法概述</span>
              <span class="ico-wrap" aria-hidden="true"><svg class="ico-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </button>
            <button type="button" data-example="notes">
              <span>填写笔记</span>
              <span class="ico-wrap" aria-hidden="true"><svg class="ico-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </button>
            <button type="button" data-example="schema">
              <span>新建审阅列</span>
              <span class="ico-wrap" aria-hidden="true"><svg class="ico-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
            </button>
            <button type="button" data-example="table">
              <span>新建数据表</span>
              <span class="ico-wrap" aria-hidden="true"><svg class="ico-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
            </button>
            <button type="button" data-example="base">
              <span>新建多维表格</span>
              <span class="ico-wrap" aria-hidden="true"><svg class="ico-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
            </button>
          </div>
        </div>

        <button type="button" class="paper-detail-pill earlier-messages" id="history-earlier-messages" hidden>查看更早消息</button>
        <div class="chat" id="chat" role="log" aria-live="polite" aria-label="对话记录">
          <article class="intro-message message assistant" id="welcome">
            <div class="bubble">
              <p>粘贴论文链接开始，或直接点上方示例试试。</p>
            </div>
          </article>
        </div>

        <template id="activity-template">
          <details class="activity-card" hidden>
            <summary class="activity-summary">
              <span class="activity-head-icon" aria-hidden="true"></span>
              <span class="activity-title">执行过程</span>
              <span class="activity-count"></span>
              <span class="activity-chevron" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m6 9 6 6 6-6"/>
                </svg>
              </span>
            </summary>
            <div class="activity-body">
              <div class="activity-body-inner">
                <ol class="activity-list" aria-label="执行步骤"></ol>
              </div>
            </div>
          </details>
        </template>

        <form id="composer" class="composer-outer-shell">
          <div id="context-strip" class="context-strip" hidden>
            <span id="context-table"></span>
            <span id="context-focus" hidden></span>
            <button type="button" id="context-forget" class="context-forget" aria-label="清除当前论文" title="清除当前论文" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <div class="composer-card">
            <input id="pdf-files" type="file" accept=".pdf,application/pdf" multiple hidden>
            <details id="pdf-tray" class="pdf-tray" hidden>
              <summary class="pdf-tray-summary">
                <span class="pdf-tray-title">
                  <svg class="pdf-tray-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
                  </svg>
                  <span id="pdf-count">PDF 附件</span>
                </span>
                <span class="disclosure-chevron" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6"/>
                  </svg>
                </span>
              </summary>
              <div class="pdf-tray-body">
                <div class="pdf-controls">
                  <label>已选文件<select id="pdf-select"></select></label>
                  <a id="pdf-open" class="mini-link-pill" target="_blank" rel="noopener noreferrer"><span>预览 PDF</span><svg class="ico-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
                </div>
                <div id="pdf-associate">
                  <label>关联论文<select id="pdf-target"><option value="">手动输入链接或 DOI</option></select></label>
                  <div id="pdf-manual">
                    <label>链接或 DOI<input id="pdf-ref" list="pdf-identifiers" maxlength="2048" autocomplete="off" placeholder="https://arxiv.org/abs/... 或 DOI"></label>
                    <datalist id="pdf-identifiers"></datalist>
                    <label>论文标题<input id="pdf-title" maxlength="400" placeholder="留空自动识别标题"></label>
                  </div>
                  <button id="pdf-bind" type="button" class="icon-pill">确认关联</button>
                </div>
                <div id="pdf-bound" hidden>
                  <span id="pdf-paper"></span>
                  <button id="pdf-save" type="button" class="icon-pill">收藏论文</button>
                  <button id="pdf-extract" type="button" class="icon-pill">提取数据图表</button>
                </div>
                <p id="pdf-status" role="status"></p>
              </div>
            </details>
            <label class="screenreader" for="prompt">输入指令</label>
            <textarea id="prompt" rows="2" maxlength="2048" placeholder="粘贴论文链接，或直接说明想提取的内容…"></textarea>
            <div class="composer-actions">
              <button id="pdf-add" type="button" class="icon-pill pdf-add-btn" title="选择或拖入本地 PDF">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
                <span class="pdf-add-label">添加 PDF</span>
              </button>
              <span class="composer-hint"><kbd>Enter</kbd> 发送 · <kbd>Shift + Enter</kbd> 换行</span>
              <label class="model-picker" id="model-picker" hidden>
                <span id="model-picker-label" aria-hidden="true">模型</span>
                <select id="model-select" aria-label="选择对话模型"></select>
              </label>
              <button id="send" type="submit" class="send-pill">
                <span class="send-inner">
                  <span>发送</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14m-6-6 6 6-6 6"/>
                  </svg>
                </span>
              </button>
            </div>
          </div>
        </form>
      </section>

      <!-- 右侧悬浮卡片组：阅读清单 + 核验与依据 -->
      <div class="right-stack">
        <section class="floating-card panel records-panel" aria-labelledby="records-heading">
          <div class="panel-head records-head">
            <div class="panel-title-group">
              <span class="panel-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/>
                </svg>
              </span>
              <div>
                <h2 id="records-heading">阅读清单</h2>
                <div class="sheet-summary">
                  <span id="row-count">读取中</span>
                  <span id="field-count"></span>
                </div>
              </div>
            </div>

            <div class="records-toolbar">
              <a class="icon-pill feishu-link" id="feishu-link" target="_blank" rel="noopener noreferrer" hidden>
                打开飞书表格
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M14 4h6v6m0-6L9 15"/><path d="M10 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4"/>
                </svg>
              </a>
              <div class="segmented" id="view-switcher" role="radiogroup" aria-label="视图切换">
                <span class="seg-highlight" id="seg-highlight" aria-hidden="true"></span>
                <button type="button" class="seg-btn" role="radio" aria-checked="true" data-view="cards">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/>
                  </svg>
                  <span>卡片</span>
                </button>
                <button type="button" class="seg-btn" role="radio" aria-checked="false" data-view="table" tabindex="-1">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18"/>
                  </svg>
                  <span>表格</span>
                </button>
              </div>

              <button type="button" class="icon-pill refresh-btn" id="refresh" title="重新读取">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/>
                </svg>
                <span>刷新</span>
              </button>
            </div>
          </div>

          <div class="library-search" role="search" aria-label="筛选当前表">
            <div class="library-search-box">
              <svg class="library-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
              </svg>
              <input id="library-query" type="search" aria-label="筛选当前表的论文" placeholder="搜题名、简称或笔记…" autocomplete="off" aria-controls="records-stage">
            </div>
            <button type="button" class="paper-detail-pill" id="reset-library-filter" hidden>清除筛选</button>
            <span id="filter-count" role="status"></span>
            <div class="library-tools">
              <select id="reading-filter" class="paper-detail-pill" aria-label="筛选本地阅读进度" hidden>
                <option value="">全部进度</option><option>待读</option><option>在读</option><option>已读</option>
              </select>
              <button type="button" id="compare-mode" class="paper-detail-pill" aria-pressed="false">选择对照</button>
              <select id="export-format" class="paper-detail-pill" aria-label="导出当前清单">
                <option value="">导出清单</option><option value="bib">BibTeX (.bib)</option><option value="ris">RIS (.ris)</option>
                <option value="md">Markdown 对比表</option><option value="csv">CSV 表格</option><option value="json">本地备份 JSON</option>
              </select>
            </div>
          </div>

          <div id="selection-bar" class="selection-bar" hidden>
            <span id="selection-count" role="status">请选择 2 至 4 篇</span>
            <div id="selection-chips"></div>
            <button id="compare-selected" type="button" class="paper-detail-pill" disabled>打开对照</button>
          </div>

          <!-- 字段胶囊条 -->
          <div class="schema-strip" id="schema-strip" aria-label="当前表字段"></div>

          <!-- 数据区：卡片 & 表格 -->
          <div class="records-stage" id="records-stage">
            <div class="cards-list" id="cards-view" role="region" aria-label="论文卡片列表"></div>

            <div class="sheet-scroll" id="table-view" role="region" aria-label="论文记录表" tabindex="0" hidden>
              <table id="sheet"></table>
            </div>

            <div id="empty-sheet" class="sheet-empty">
              <div class="empty-illustration" aria-hidden="true">
                <svg viewBox="0 0 88 68" fill="none">
                  <rect x="14" y="18" width="60" height="38" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
                  <rect x="8" y="10" width="60" height="38" rx="10" fill="var(--card)" stroke="currentColor" stroke-opacity="0.24" stroke-width="1.5"/>
                  <line x1="18" y1="22" x2="44" y2="22" stroke="currentColor" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="18" y1="30" x2="56" y2="30" stroke="currentColor" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
                  <line x1="18" y1="37" x2="36" y2="37" stroke="currentColor" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <p class="empty-text" id="empty-sheet-text">正在读取…</p>
              <button type="button" class="empty-cta" id="empty-try-btn" hidden><span>存入示例论文</span><svg class="ico-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
            </div>
          </div>
        </section>

        <!-- 底部双悬浮卡片：写入核验 & 论文依据 -->
        <div class="inspect-grid">
          <section class="floating-card inspect-card verification" aria-labelledby="result-heading">
            <div class="inspect-head">
              <div class="inspect-title">
                <span class="status-badge idle" id="verify-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
                  </svg>
                </span>
                <h3 id="result-heading">写入核验</h3>
              </div>
            </div>
            <div id="verification" role="status" class="verify-status">写入后自动核对结果</div>
          </section>

          <section class="floating-card inspect-card sources" aria-labelledby="sources-heading">
            <div class="inspect-head">
              <div class="inspect-title">
                <span class="status-badge quote" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M9 7h6M9 11h4"/>
                  </svg>
                </span>
                <h3 id="sources-heading">原文出处</h3>
              </div>
            </div>
            <div id="evidence" class="evidence-list">
              <p class="muted">提取内容时会自动附上原文位置。</p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <dialog id="history-dialog" aria-labelledby="history-title">
    <div class="detail-shell">
      <header class="detail-head">
        <div><h2 id="history-title">历史与记忆</h2><p id="history-table-name"></p></div>
        <button type="button" class="icon-pill close-btn" id="history-close" aria-label="关闭历史与记忆">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
          <span>关闭</span>
        </button>
      </header>
      <nav class="history-tabs" aria-label="历史与记忆视图">
        <button type="button" data-history-tab="chats" aria-pressed="true">对话历史</button>
        <button type="button" data-history-tab="operations" aria-pressed="false">操作历史</button>
        <button type="button" data-history-tab="memory" aria-pressed="false">记忆设置</button>
      </nav>
      <div class="history-body" id="history-body">
        <section data-history-section="chats" aria-label="对话历史">
          <div class="history-actions">
            <button type="button" class="send-pill" id="history-new">新建对话</button>
            <button type="button" class="paper-detail-pill" id="history-clear">清空本表对话</button>
          </div>
          <div id="history-chats" class="history-list"></div>
        </section>
        <section data-history-section="operations" aria-label="操作历史" hidden>
          <div id="history-operations" class="history-list"></div>
          <button type="button" class="paper-detail-pill" id="history-earlier-operations" hidden>加载更早操作</button>
        </section>
        <section data-history-section="memory" aria-label="记忆设置" hidden>
          <div class="history-settings">
            <label><span>保存本表的新对话消息</span><input type="checkbox" class="switch-input" id="history-save" data-setting="save_history"></label>
            <label><span>重开对话时续读上次的论文</span><input type="checkbox" class="switch-input" id="history-resume" data-setting="resume_focus"></label>
            <label><span>使用本表已保存的偏好</span><input type="checkbox" class="switch-input" id="history-use" data-setting="use_preferences"></label>
          </div>
          <form id="preference-form" class="preference-form">
            <label for="preference-input">提取结果的默认写入列</label>
            <div class="pref-builder">
              <select id="pref-kind-select" aria-label="选择提取内容类型"></select>
              <span class="pref-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14m-6-6 6 6-6 6"/>
                </svg>
              </span>
              <select id="pref-col-select" aria-label="选择默认写入列"></select>
            </div>
            <div><input id="preference-input" list="preference-options" maxlength="240" autocomplete="off" placeholder="代码链接优先写入「研究笔记」"><button type="submit" class="icon-pill" id="preference-save">记住</button></div>
            <datalist id="preference-options"></datalist>
          </form>
          <div id="history-preferences" class="history-list"></div>
        </section>
      </div>
      <div id="history-decision" class="history-decision" hidden>
        <p id="history-decision-text"></p><button type="button" class="paper-detail-pill" id="history-back">取消</button><button type="button" class="paper-detail-pill" id="history-accept">确认删除</button>
      </div>
      <p id="history-error" role="alert" hidden></p>
    </div>
  </dialog>

  <dialog id="evidence-review" aria-labelledby="review-title" aria-describedby="review-summary">
    <div class="detail-shell">
      <header class="detail-head">
        <div>
          <h2 id="review-title" tabindex="-1">确认提取结果</h2>
          <p id="review-summary"></p>
        </div>
        <button type="button" class="icon-pill close-btn" id="review-close" aria-label="关闭预览">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
          <span>关闭</span>
        </button>
      </header>
      <div id="review-paper-tabs" class="review-paper-tabs" role="tablist" aria-label="本批论文列表" hidden></div>
      <div class="review-tools">
        <label>论文<select id="review-paper-select" aria-label="切换核对的论文"></select></label>
        <label>筛选<select id="review-kind" aria-label="筛选提取项"></select></label>
      </div>
      <div id="review-papers"></div>
      <footer class="review-footer" hidden>
        <button type="button" class="icon-pill" id="review-cancel">取消</button>
        <button type="button" class="send-pill" id="review-confirm">确认写入</button>
      </footer>
    </div>
  </dialog>

  <dialog id="comparison-detail" aria-labelledby="comparison-title">
    <div class="detail-shell">
      <div class="detail-head">
        <h2 id="comparison-title">论文对照</h2>
        <button id="copy-comparison" type="button" class="paper-detail-pill"><span class="copy-txt">复制 Markdown</span></button>
        <button type="button" class="icon-pill close-btn" id="close-comparison" aria-label="关闭论文对照">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
          <span>关闭</span>
        </button>
      </div>
      <div id="comparison-body"></div>
    </div>
  </dialog>

  <dialog id="detail">
    <div class="detail-shell">
      <div class="detail-head">
        <h2>记录详情</h2>
        <button id="copy-citation" type="button" class="paper-detail-pill"><span class="copy-txt">复制 BibTeX</span></button>
        <button id="close-detail" type="button" class="icon-pill close-btn" aria-label="关闭记录详情">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
          <span>关闭</span>
        </button>
      </div>
      <dl id="detail-content"></dl>
    </div>
  </dialog>

  <dialog id="img-lightbox" class="img-lightbox" aria-label="原图与 PDF 原页预览">
    <div class="lightbox-shell">
      <button type="button" class="icon-pill close-btn lightbox-close" id="lightbox-close" aria-label="关闭放大预览">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
        <span>关闭</span>
      </button>
      <img id="lightbox-img" alt="">
      <p id="lightbox-caption" class="lightbox-caption"></p>
    </div>
  </dialog>
</body>
</html>
