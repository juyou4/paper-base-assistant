<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f7" id="meta-theme-color">
  <title>论文入表助手</title>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/katex/katex.min.js"></script>
  <script defer src="/vendor/markdown-it/markdown-it.min.js"></script>
  <script defer src="/rich-text.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <aside class="toast-region" id="toast-region" aria-live="polite" aria-label="通知"></aside>

  <header class="top-nav-wrap">
    <div class="top-capsule">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a2.5 2.5 0 0 1 0-5H20"/>
          </svg>
        </span>
        <span class="brand-name">研读工作台</span>
      </div>

      <div class="nav-right">
        <span class="mode" id="mode" role="status">
          <i aria-hidden="true"></i>
          <span>连接中</span>
        </span>

        <button type="button" class="icon-pill theme-btn" id="theme-toggle" aria-label="切换深浅色" title="切换深浅色">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2m-7.07-14.93 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="intro" aria-labelledby="title">
      <div class="intro-copy">
        <h1 id="title">论文入表助手</h1>
        <p>贴入论文链接，用一句话更新阅读清单。</p>
      </div>

      <aside class="floating-card sample-card" hidden id="sample">
        <div class="sample-top">
          <span class="sample-badge">示例论文</span>
          <div class="sample-actions">
            <button type="button" class="mini-copy-btn" id="copy-sample-url" aria-label="复制示例论文链接">
              <svg class="copy-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
              </svg>
              <span class="copy-txt">复制链接</span>
            </button>
            <a id="sample-pdf" class="sample-pdf-pill" hidden target="_blank" rel="noopener noreferrer">PDF ↗</a>
          </div>
        </div>
        <div id="sample-title" class="sample-title"></div>
      </aside>
    </section>

    <div class="desk">
      <!-- 左侧悬浮卡片：对话 -->
      <section class="floating-card panel command-panel" aria-labelledby="command-heading">
        <div class="panel-head">
          <div class="panel-title-group">
            <span class="panel-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </span>
            <div>
              <h2 id="command-heading">对话</h2>
              <p class="engine-status" id="engine-mode" role="status" hidden></p>
            </div>
          </div>
          <span class="pending-pill" id="pending-badge" hidden>待确认</span>
        </div>

        <div class="examples">
          <div class="examples-header">
            <span class="small-label">点击试用</span>
          </div>
          <div class="example-grid" id="example-grid">
            <span class="example-glide" id="example-glide" aria-hidden="true"></span>
            <button type="button" data-example="evidence" title="从两篇示例论文提取关键数据与图表，核对后回填">
              <span>批量提取数据与图表</span>
              <i aria-hidden="true">↗</i>
            </button>
            <button type="button" data-example="save">
              <span>存入示例论文</span>
              <i aria-hidden="true">↗</i>
            </button>
            <button type="button" data-example="method">
              <span>补充方法概述</span>
              <i aria-hidden="true">↗</i>
            </button>
            <button type="button" data-example="notes">
              <span>填写笔记</span>
              <i aria-hidden="true">↗</i>
            </button>
            <button type="button" data-example="schema">
              <span>新建审阅列</span>
              <i aria-hidden="true">+</i>
            </button>
          </div>
        </div>

        <div class="chat" id="chat" role="log" aria-live="polite" aria-label="对话记录">
          <article class="intro-message message assistant" id="welcome">
            <div class="bubble">
              <p>可以粘贴多篇论文链接，或点「批量提取数据与图表」试试。</p>
            </div>
          </article>
        </div>

        <template id="activity-template">
          <details class="activity-card" hidden>
            <summary class="activity-summary">
              <span>执行过程</span>
              <span class="activity-count"></span>
              <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 6 3 3 3-3"/></svg>
            </summary>
            <ol class="activity-list" aria-label="执行步骤"></ol>
          </details>
        </template>

        <form id="composer" class="composer-outer-shell">
          <div class="composer-card">
            <input id="pdf-files" type="file" accept=".pdf,application/pdf" multiple hidden>
            <details id="pdf-tray" class="pdf-tray" hidden>
              <summary id="pdf-count">PDF 附件</summary>
              <div class="pdf-controls">
                <label>当前附件<select id="pdf-select"></select></label>
                <a id="pdf-open" target="_blank" rel="noopener noreferrer">打开原文</a>
              </div>
              <div id="pdf-associate">
                <label>关联论文<select id="pdf-target"><option value="">输入 DOI 或论文链接</option></select></label>
                <div id="pdf-manual">
                  <label>DOI 或论文链接<input id="pdf-ref" list="pdf-identifiers" maxlength="2048" autocomplete="off"></label>
                  <datalist id="pdf-identifiers"></datalist>
                  <label>论文标题<input id="pdf-title" maxlength="400" placeholder="可留空，系统将查询题名"></label>
                </div>
                <button id="pdf-bind" type="button" class="icon-pill">确认关联这份正文</button>
              </div>
              <div id="pdf-bound" hidden>
                <span id="pdf-paper"></span>
                <button id="pdf-save" type="button" class="icon-pill">收藏论文</button>
                <button id="pdf-extract" type="button" class="icon-pill">预览数据与图表</button>
              </div>
              <p id="pdf-status" role="status"></p>
            </details>
            <label class="screenreader" for="prompt">输入指令</label>
            <textarea id="prompt" rows="2" maxlength="2048" placeholder="贴入论文链接，或说“给刚才那篇补一句方法概述”…"></textarea>
            <div class="composer-actions">
              <button id="pdf-add" type="button" class="icon-pill" title="选择或拖入本地 PDF">添加 PDF</button>
              <span class="composer-hint"><kbd>Enter</kbd> 发送 · <kbd>Shift + Enter</kbd> 换行</span>
              <label class="model-picker" id="model-picker" hidden>
                <span id="model-picker-label" aria-hidden="true">模型</span>
                <select id="model-select" aria-label="选择对话模型"></select>
              </label>
              <button id="send" type="submit" class="send-pill">
                <span class="send-inner">
                  <span>发送</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14m-6-6 6 6-6 6"/>
                  </svg>
                </span>
              </button>
            </div>
          </div>
        </form>
      </section>

      <!-- 右侧悬浮卡片组：阅读清单 + 核验与依据 -->
      <div class="right-stack">
        <section class="floating-card panel records-panel" aria-labelledby="records-heading">
          <div class="panel-head records-head">
            <div class="panel-title-group">
              <span class="panel-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/>
                </svg>
              </span>
              <div>
                <h2 id="records-heading">阅读清单</h2>
                <div class="sheet-summary">
                  <span id="row-count">读取中</span>
                  <span id="field-count"></span>
                </div>
              </div>
            </div>

            <div class="records-toolbar">
              <a class="icon-pill feishu-link" id="feishu-link" target="_blank" rel="noopener noreferrer" hidden>
                打开飞书表格
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M14 4h6v6m0-6L9 15"/><path d="M10 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4"/>
                </svg>
              </a>
              <div class="segmented" id="view-switcher" role="radiogroup" aria-label="视图切换">
                <span class="seg-highlight" id="seg-highlight" aria-hidden="true"></span>
                <button type="button" class="seg-btn" role="radio" aria-checked="true" data-view="cards">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/>
                  </svg>
                  <span>卡片</span>
                </button>
                <button type="button" class="seg-btn" role="radio" aria-checked="false" data-view="table" tabindex="-1">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18"/>
                  </svg>
                  <span>表格</span>
                </button>
              </div>

              <button type="button" class="icon-pill refresh-btn" id="refresh" title="重新读取">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/>
                </svg>
                <span>刷新</span>
              </button>
            </div>
          </div>

          <!-- 字段胶囊条 -->
          <div class="schema-strip" id="schema-strip" aria-label="当前表字段"></div>

          <!-- 数据区：卡片 & 表格 -->
          <div class="records-stage" id="records-stage">
            <div class="cards-list" id="cards-view" role="region" aria-label="论文卡片列表"></div>

            <div class="sheet-scroll" id="table-view" role="region" aria-label="论文记录表" tabindex="0" hidden>
              <table id="sheet"></table>
            </div>

            <div id="empty-sheet" class="sheet-empty">
              <div class="empty-illustration" aria-hidden="true">
                <svg viewBox="0 0 88 68" fill="none">
                  <rect x="14" y="18" width="60" height="38" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.5"/>
                  <rect x="8" y="10" width="60" height="38" rx="10" fill="var(--card)" stroke="currentColor" stroke-opacity="0.24" stroke-width="1.5"/>
                  <line x1="18" y1="22" x2="44" y2="22" stroke="currentColor" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="18" y1="30" x2="56" y2="30" stroke="currentColor" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
                  <line x1="18" y1="37" x2="36" y2="37" stroke="currentColor" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <p class="empty-text" id="empty-sheet-text">正在读取…</p>
              <button type="button" class="empty-cta" id="empty-try-btn" hidden>存入示例论文 ↗</button>
            </div>
          </div>
        </section>

        <!-- 底部双悬浮卡片：写入核验 & 论文依据 -->
        <div class="inspect-grid">
          <section class="floating-card inspect-card verification" aria-labelledby="result-heading">
            <div class="inspect-head">
              <div class="inspect-title">
                <span class="status-badge idle" id="verify-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
                  </svg>
                </span>
                <h3 id="result-heading">写入核验</h3>
              </div>
            </div>
            <div id="verification" role="status" class="verify-status">写入后自动回读校验</div>
          </section>

          <section class="floating-card inspect-card sources" aria-labelledby="sources-heading">
            <div class="inspect-head">
              <div class="inspect-title">
                <span class="status-badge quote" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M9 7h6M9 11h4"/>
                  </svg>
                </span>
                <h3 id="sources-heading">论文依据</h3>
              </div>
            </div>
            <div id="evidence" class="evidence-list">
              <p class="muted">提取摘要或方法时附上原文出处。</p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <dialog id="evidence-review" aria-labelledby="review-title" aria-describedby="review-summary">
    <div class="detail-shell">
      <header class="detail-head">
        <div>
          <h2 id="review-title" tabindex="-1">核对论文提取结果</h2>
          <p id="review-summary"></p>
        </div>
        <button type="button" class="icon-pill" id="review-close" aria-label="关闭预览">关闭</button>
      </header>
      <div class="review-tools">
        <label>论文<select id="review-paper-select" aria-label="切换核对的论文"></select></label>
        <label>提取项<select id="review-kind" aria-label="筛选提取项"></select></label>
      </div>
      <div id="review-papers"></div>
      <footer class="review-footer" hidden>
        <button type="button" class="icon-pill" id="review-cancel">取消回填</button>
        <button type="button" class="send-pill" id="review-confirm">确认回填</button>
      </footer>
    </div>
  </dialog>

  <dialog id="detail">
    <div class="detail-shell">
      <div class="detail-head">
        <h2>记录详情</h2>
        <button id="close-detail" type="button" class="icon-pill close-btn" aria-label="关闭记录详情">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
          <span>关闭</span>
        </button>
      </div>
      <dl id="detail-content"></dl>
    </div>
  </dialog>
</body>
</html>
